<!doctype html>
<html>
  <head></head>
  <body>
    <button data-sidebar-destination="builtin:home" aria-current="page">Home</button>
    <div class="layout" data-app-shell-workspace-row="true" style="display:flex; flex-direction:row; width:1600px; height:1000px">
      <div data-app-shell-active-page="true" style="display:contents">
        <header data-app-shell-header-toolbar="true" style="display:flex; flex-direction:row; width:1600px; height:46px">
          <div class="toolbar-title" style="display:flex; flex:1"></div>
          <div class="toolbar-actions" style="display:flex; flex-direction:row; justify-content:flex-end; gap:8px">
            <div class="toolbar-capsule" style="display:flex; flex-direction:row; gap:8px">
              <button type="button" aria-label="Chat actions">More</button>
              <button type="button" aria-label="Share">Share</button>
              <button type="button" aria-label="View chat usage">Usage</button>
              <button type="button" data-thread-summary-panel-toggle="true" aria-label="Toggle summary">Summary</button>
            </div>
          </div>
        </header>
        <main data-app-shell-main-surface="default"><section data-app-shell-focus-area="main">Conversation</section></main>
      </div>
    </div>
  </body>
</html>
